/*
 * Multi-version build.
 *
 *   ./gradlew build -Pmc=1.21.11
 *
 * Every supported target has a properties file in versions/<mc>.properties. The Java
 * sources are made of the shared code in src/main plus one "compat" overlay per API
 * family (src/compat/<family>) selected by that file. tracks.json is generated for the
 * exact Minecraft version from the sounds.json of the real client jar, so the player only
 * lists music that really exists in the targeted game.
 */

import groovy.json.JsonOutput
import groovy.json.JsonSlurper


buildscript {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:1.17-SNAPSHOT"
    }
}

// ---------------------------------------------------------------- target selection

def targetMc = (findProperty('mc') ?: '1.21.11').toString()
def versionFile = rootProject.file("versions/${targetMc}.properties")
if (!versionFile.exists()) {
    throw new GradleException("Unknown Minecraft target '${targetMc}'. Available: " +
            rootProject.file('versions').listFiles().findAll { it.name.endsWith('.properties') }
                    .collect { it.name - '.properties' }.sort().join(', '))
}
def v = new Properties()
versionFile.withInputStream { v.load(it) }
ext.mcProps = v

def minecraftVersion = v.minecraft_version
def javaVersion = (v.java_version as String).toInteger()
def noRemap = v.loom_plugin == 'net.fabricmc.fabric-loom'

apply plugin: v.loom_plugin

version = "${project.mod_version}+mc${minecraftVersion}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

// ---------------------------------------------------------------- source overlays

def overlays = ["gfx-${v.gfx_family}", "screen-${v.screen_family}", "core-${v.core_family}"]
sourceSets {
    main {
        java {
            overlays.each { srcDir "src/compat/${it}/java" }
        }
    }
}
overlays.each {
    if (!rootProject.file("src/compat/${it}/java").isDirectory()) {
        throw new GradleException("Missing compat overlay src/compat/${it}/java for target ${targetMc}")
    }
}
logger.lifecycle("JukeboxPlus ${project.version} -> Minecraft ${minecraftVersion} (Java ${javaVersion}, overlays ${overlays.join(', ')})")

// ---------------------------------------------------------------- dependencies

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    if (noRemap) {
        implementation "net.fabricmc:fabric-loader:${v.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${v.fabric_api_version}"
    } else {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${v.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${v.fabric_api_version}"
    }
}

// ---------------------------------------------------------------- tracks.json generation

/**
 * Builds assets/jukeboxplus/tracks.json + sounds.json for the exact Minecraft version:
 * data/tracks.json holds the metadata for every track ever shipped by vanilla, the client
 * jar's sounds.json tells us which files really exist in this version.
 */
def generatedResources = layout.buildDirectory.dir("generated/jukeboxplus")

tasks.register('generateTrackData') {
    def outDir = generatedResources
    def metaFile = rootProject.file('data/tracks.json')
    inputs.file metaFile
    inputs.property 'mc', minecraftVersion
    outputs.dir outDir

    doLast {
        def dir0 = layout.buildDirectory.dir('trackdata').get().asFile
        // sounds.json is not inside the client jar: it is an object of the asset index.
        // Resolve it through Mojang's version manifest (cached under build/).
        Set<String> available = new HashSet<>()
        try {
            def cache = new File(dir0, "sounds-${minecraftVersion}.json")
            if (!cache.exists()) {
                def manifest = new JsonSlurper().parse(new URL('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'))
                def entry = manifest.versions.find { it.id == minecraftVersion }
                if (entry == null) throw new GradleException("Unknown version ${minecraftVersion} in Mojang manifest")
                def versionJson = new JsonSlurper().parse(new URL(entry.url as String))
                def index = new JsonSlurper().parse(new URL(versionJson.assetIndex.url as String))
                def hash = index.objects['minecraft/sounds.json'].hash as String
                cache.parentFile.mkdirs()
                cache.bytes = new URL("https://resources.download.minecraft.net/${hash.substring(0, 2)}/${hash}").bytes
            }
            def sounds = new JsonSlurper().parse(cache)
            sounds.each { String key, Object def_ ->
                if (!key.startsWith('music')) return
                (def_.sounds ?: []).each { s ->
                    if (s instanceof String) available << s
                    else if (s instanceof Map && s.type != 'event' && s.name) available << (s.name as String)
                }
            }
            logger.lifecycle("sounds.json of Minecraft ${minecraftVersion}: ${available.size()} music files")
        } catch (Exception e) {
            logger.warn("Could not read sounds.json for ${minecraftVersion} (${e.message}); shipping every known track")
        }

        def meta = new JsonSlurper().parse(metaFile)
        def selected = meta.findAll { t -> available.isEmpty() || available.contains(t.path) }
        def missingMeta = available.findAll { p -> !meta.any { it.path == p } }
        missingMeta.each { p ->
            // A track we do not know about (new version): ship it with a generated title.
            selected << [path: p, title: null, artist: '', category: p.startsWith('records/') ? 'discs' : 'overworld']
        }
        if (!missingMeta.isEmpty()) logger.warn("Tracks without metadata: ${missingMeta}")

        def tracks = selected.collect { t -> [path: t.path, title: t.title, artist: t.artist, category: t.category] }
        def soundsJson = [:]
        tracks.each { t ->
            soundsJson[t.path] = [sounds: [[name: t.path, stream: true, preload: false, attenuation_distance: 0]]]
        }
        def dir = outDir.get().asFile
        def assets = new File(dir, 'assets/jukeboxplus')
        assets.mkdirs()
        new File(assets, 'tracks.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(tracks))
        new File(assets, 'sounds.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(soundsJson))
        logger.lifecycle("Generated tracks.json with ${tracks.size()} tracks for Minecraft ${minecraftVersion}")
    }
}

sourceSets.main.resources.srcDir generatedResources
tasks.named('processResources') { dependsOn 'generateTrackData' }
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn 'generateTrackData' }

// ---------------------------------------------------------------- resources

processResources {
    def props = [
            version          : project.version,
            minecraft_range  : v.minecraft_range,
            loader_version   : v.loader_version,
            java_version     : javaVersion.toString(),
            mixin_java       : v.mixin_java,
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching(['fabric.mod.json', 'jukeboxplus.mixins.json']) {
        expand props
    }
}

// ---------------------------------------------------------------- java

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = javaVersion
}

java {
    // No toolchain on purpose: Gradle runs on a modern JDK and javac targets the game's
    // Java level through --release, so a single JDK can build every target.
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
